name: Android Release APK

on:
  # Fires when a release is created (manually via `gh release create` or
  # via the GitHub UI). The job rebuilds the APK in a clean CI environment
  # and uploads it to the release with --clobber, overwriting whatever APK
  # was attached at release-creation time.
  #
  # We deliberately do NOT fire on push:tags. That path used to also try
  # `gh release create`, which collides ("a release with the same tag name
  # already exists") whenever the release was created manually first —
  # producing a failure notification on every release.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore release signing key
        env:
          HIKARI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIKARI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$HIKARI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hikari-release.jks"
          echo "HIKARI_RELEASE_KEYSTORE=$RUNNER_TEMP/hikari-release.jks" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test

      - name: Build release APK
        working-directory: android
        env:
          HIKARI_RELEASE_STORE_PASSWORD: ${{ secrets.HIKARI_RELEASE_STORE_PASSWORD }}
          HIKARI_RELEASE_KEY_PASSWORD: ${{ secrets.HIKARI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Signatur muss bei jedem Release identisch sein — weicht der SHA-256 ab,
      # verweigert Android In-Place-Updates und Nutzer verlieren ihre Daten.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools"/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/hikari-${GITHUB_REF_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-apk
          path: release-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/*.apk --clobber
