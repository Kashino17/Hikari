name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test
        run: npm test
      # Lint is informational for now: the repo predates CI and carries a
      # backlog of biome formatting findings. Surfacing them without failing the
      # build keeps tsc + tests as the real gates until the backlog is cleared.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
